[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techlogistics"
version = "1.0.0"
description = "Data Hub & Sistema de Soporte a la Decisión — TechLogistics S.A.S."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "streamlit",
    "plotly",
    "groq",
    "matplotlib",
    "reportlab",
    "statsmodels",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
